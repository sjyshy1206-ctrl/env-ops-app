<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>환경 운영일지 · TMS 통합 시스템</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f6f3;--card:#fff;--line:#e3e2dc;--line2:#cfcdc4;--text:#1f1f1d;--sub:#5f5e5a;--muted:#8a8984;
  --acc:#185FA5;--acc-bg:#E6F1FB;
  --ok:#0F6E56;--ok-bg:#E1F5EE;--warn:#854F0B;--warn-bg:#FAEEDA;--over:#A32D2D;--over-bg:#FCEBEB;
  --gray-bg:#F1EFE8;--gray:#5F5E5A;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Noto Sans KR",system-ui,sans-serif;font-size:14px;line-height:1.55}
header{background:var(--card);border-bottom:1px solid var(--line)}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}
.top{display:flex;align-items:center;gap:16px;padding:14px 0;flex-wrap:wrap}
.brand{font-size:18px;font-weight:700;letter-spacing:-.2px}
.brand small{display:block;font-size:12px;font-weight:400;color:var(--sub)}
.sim{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.clock{font-variant-numeric:tabular-nums;color:var(--sub);font-size:13px}
.clock b{color:var(--text);font-weight:500}
nav{display:flex;gap:4px;overflow-x:auto}
nav a{padding:10px 14px;color:var(--sub);text-decoration:none;border-bottom:2px solid transparent;white-space:nowrap;font-weight:500}
nav a.on{color:var(--acc);border-color:var(--acc)}
main.wrap{padding-top:20px;padding-bottom:60px}
h2{font-size:17px;margin:0 0 12px;font-weight:700}
h3{font-size:15px;margin:0 0 10px;font-weight:700;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
h3 .muted{font-weight:400}
.muted{color:var(--muted);font-size:12px}
.sub{color:var(--sub)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:16px}
.grid{display:grid;gap:12px}
.g4{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.metric{border-radius:10px;padding:14px 16px;background:var(--gray-bg)}
.metric .l{font-size:12px;color:var(--sub)}
.metric .v{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
.metric.over{background:var(--over-bg)} .metric.over .v,.metric.over .l{color:var(--over)}
.metric.warn{background:var(--warn-bg)} .metric.warn .v,.metric.warn .l{color:var(--warn)}
.metric.info{background:var(--acc-bg)} .metric.info .v,.metric.info .l{color:var(--acc)}
.badge{display:inline-block;padding:1px 8px;border-radius:999px;font-size:12px;font-weight:500;white-space:nowrap}
.b-ok{background:var(--ok-bg);color:var(--ok)}.b-warn{background:var(--warn-bg);color:var(--warn)}
.b-over{background:var(--over-bg);color:var(--over)}.b-rec,.b-none{background:var(--gray-bg);color:var(--gray)}
.b-acc{background:var(--acc-bg);color:var(--acc)}
table{width:100%;border-collapse:collapse}
th{font-size:12px;color:var(--sub);font-weight:500;text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.tbl{overflow-x:auto}
input,select,textarea,button{font:inherit;color:inherit}
input[type=number],input[type=text],input[type=date],select{height:34px;border:1px solid var(--line2);border-radius:8px;padding:0 10px;background:#fff;min-width:0}
input[type=number]{width:110px;text-align:right}
textarea{width:100%;min-height:120px;border:1px solid var(--line2);border-radius:8px;padding:8px 10px;font-family:ui-monospace,Consolas,monospace;font-size:12px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--acc-bg);border-color:var(--acc)}
button{height:34px;padding:0 14px;border-radius:8px;border:1px solid var(--line2);background:#fff;cursor:pointer;font-weight:500}
button:hover{background:var(--gray-bg)}
button.primary{background:var(--acc);border-color:var(--acc);color:#fff}
button.primary:hover{background:#0C447C}
button.small{height:28px;padding:0 10px;font-size:12px}
button.danger{color:var(--over)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{height:32px;border-radius:999px;padding:0 14px}
.pill.on{background:var(--text);color:#fff;border-color:var(--text)}
.err{color:var(--over);font-size:12px;margin-top:4px}
.lock{color:var(--muted);font-size:12px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.tile .n{font-size:12px;color:var(--sub);display:flex;justify-content:space-between;gap:6px}
.tile .v{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;margin:2px 0}
.tile .v small{font-size:12px;font-weight:400;color:var(--sub)}
.tile .p{font-size:12px;color:var(--over);margin-top:4px}
.tile.over{border-color:#F09595;background:#FFF8F8}.tile.warn{border-color:#FAC775}.tile.dim{opacity:.6}
.list{display:flex;flex-direction:column}
.li{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .t{flex:1}
.dday{font-weight:700;font-variant-numeric:tabular-nums;min-width:52px;text-align:right}
.dd-over{color:var(--over)}.dd-warn{color:var(--warn)}.dd-ok{color:var(--sub)}
.chartbox{position:relative;height:340px}
.note{background:var(--gray-bg);border-radius:8px;padding:10px 12px;font-size:12px;color:var(--sub)}
code{font-family:ui-monospace,Consolas,monospace;font-size:12px;background:var(--gray-bg);padding:1px 5px;border-radius:4px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#2C2C2A;color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw}
#toast.show{opacity:1}
.hide{display:none}
.live-dot{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.live-dot.on{background:#E24B4A;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.3}}
.manual-row td:first-child{font-weight:500}
.tl{overflow-x:auto}
.tl-in{min-width:860px}
.tl-head,.tl-row{display:flex;align-items:stretch}
.tl-lab{width:270px;flex:none;padding:6px 10px 6px 0;font-size:13px;line-height:1.35}
.tl-track{flex:1;position:relative;border-left:1px solid var(--line)}
.tl-head .tl-track{height:34px}
.nw{white-space:nowrap}
.tl-mlab{position:absolute;top:0;font-size:11px;color:var(--sub);transform:translateX(4px);white-space:nowrap}
.tl-m{position:absolute;top:0;bottom:0;width:1px;background:#efeee9}
.tl-grp{font-weight:700;font-size:13px;padding:10px 0 4px;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center}
.tl-row{border-bottom:1px solid #f0efea;cursor:pointer}
.tl-row:hover{background:#fafaf7}
.tl-row .tl-track{min-height:38px}
.tl-today{position:absolute;top:0;bottom:0;width:2px;background:#E24B4A;opacity:.55;z-index:1}
.tl-head .tl-today{opacity:1;top:16px}
.tl-todaylab{margin-left:16px}
.tl-todaylab{position:absolute;top:16px;font-size:11px;color:#A32D2D;transform:translateX(-50%);background:#fff;padding:0 3px;z-index:2;font-weight:500}
.lead{position:absolute;top:50%;height:8px;margin-top:-4px;border-radius:4px;background:#FAEEDA}
.lead.overdue{background:#FCEBEB}
.mk{position:absolute;top:50%;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;z-index:2;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.08)}
.mk-overdue{background:#E24B4A}.mk-soon{background:#EF9F27}.mk-ok{background:#378ADD}
.mk-pred{background:#fff;border:1.5px solid #B4B2A9;width:10px;height:10px;margin:-5px 0 0 -5px;box-shadow:none}
.mk-done{background:#1D9E75;width:10px;height:10px;margin:-5px 0 0 -5px}
.mk-tick{position:absolute;top:50%;width:2px;height:10px;margin-top:-5px;background:#B4B2A9;border-radius:1px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--sub);align-items:center}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px 16px}
.form label{display:block;font-size:12px;color:var(--sub);margin-bottom:4px}
.form input[type=text],.form input[type=date],.form input[type=number],.form select{width:100%}
.form .wide{grid-column:1/-1}
.form textarea{min-height:70px;font-family:inherit;font-size:13px}
.panel{border:1.5px solid var(--acc);}
.hist .li{font-size:13px}
.plant-box{border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px}
.eq-row{display:flex;gap:8px;align-items:center;margin-top:6px}
@media (max-width:640px){.wrap{padding:0 12px}.card{padding:14px}input[type=number]{width:90px}.chartbox{height:280px}}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="top">
      <div class="brand">환경 운영일지<small>TMS 연동 시제품 · 모든 값은 가상 데이터예요</small></div>
      <div class="sim">
        <span class="clock"><span class="live-dot" id="liveDot"></span> 시뮬레이션 시각 <b id="simClock">-</b></span>
        <button id="simBtn" class="small">실시간 시뮬레이션 시작</button>
      </div>
    </div>
    <nav id="nav">
      <a href="#status" data-v="status">현황</a>
      <a href="#input" data-v="input">오늘 입력</a>
      <a href="#legal" data-v="legal">법정 일정</a>
      <a href="#laws" data-v="laws">법령 개정</a>
      <a href="#history" data-v="history">이력 그래프</a>
      <a href="#settings" data-v="settings">데이터·설정</a>
    </nav>
  </div>
</header>
<main class="wrap">
  <section id="v-status"></section>
  <section id="v-input" class="hide"></section>
  <section id="v-legal" class="hide"></section>
  <section id="v-laws" class="hide"></section>
  <section id="v-history" class="hide"></section>
  <section id="v-settings" class="hide"></section>
</main>
<div id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script>
const $=s=>document.querySelector(s);
const MIN=60000,H=3600000,D=86400000,STEP=5*MIN;
const STATUS=['정상','점검','교정','통신불량','전원단절'];
const LS='envapp_v1';
const pad=n=>String(n).padStart(2,'0');
const fmtDate=t=>{const d=new Date(t);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const fmtTime=t=>{const d=new Date(t);return pad(d.getHours())+':'+pad(d.getMinutes())};
const fmtMD=t=>{const d=new Date(t);return pad(d.getMonth()+1)+'/'+pad(d.getDate())};
const fmtFull=t=>fmtDate(t)+' '+fmtTime(t);
const dayStart=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d).getTime()};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function fmtV(v){if(v==null||isNaN(v))return '—';const a=Math.abs(v);return a>=100?Math.round(v).toLocaleString():a>=10?v.toFixed(1):v.toFixed(2)}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

const FAC=[
  {id:'W1',name:'폐수 최종방류구',kind:'수질'},
  {id:'W0',name:'폐수 생물반응조',kind:'공정'},
  {id:'A1',name:'보일러 굴뚝 #1',kind:'대기'}
];
const facOf=id=>FAC.find(f=>f.id===id);
const DEFAULT_STD=[
  {fac:'W1',item:'pH',unit:'',min:5.8,max:8.6,src:'TMS'},
  {fac:'W1',item:'TOC',unit:'mg/L',max:40,src:'TMS'},
  {fac:'W1',item:'SS',unit:'mg/L',max:80,src:'TMS'},
  {fac:'W1',item:'T-N',unit:'mg/L',max:60,src:'TMS'},
  {fac:'W1',item:'T-P',unit:'mg/L',max:8,src:'TMS'},
  {fac:'W1',item:'BOD',unit:'mg/L',max:80,src:'수기',freq:'주 1회'},
  {fac:'W1',item:'노말헥산',unit:'mg/L',max:5,src:'수기',freq:'주 1회'},
  {fac:'W0',item:'DO',unit:'mg/L',min:1.5,max:4,src:'수기',daily:true},
  {fac:'W0',item:'MLSS',unit:'mg/L',min:2000,max:4500,src:'수기',daily:true},
  {fac:'W0',item:'응집제 투입량',unit:'kg/일',src:'수기',daily:true},
  {fac:'A1',item:'먼지',unit:'mg/Sm³',max:10,src:'TMS'},
  {fac:'A1',item:'NOx',unit:'ppm',max:50,src:'TMS'},
  {fac:'A1',item:'SOx',unit:'ppm',max:30,src:'TMS'},
  {fac:'A1',item:'CO',unit:'ppm',max:50,src:'TMS'},
  {fac:'A1',item:'집진기 차압',unit:'mmH₂O',min:50,max:200,src:'수기',daily:true}
];

let simNow=Math.floor(Date.now()/STEP)*STEP;
const simNow0=simNow;
const rampStart=simNow0-8*H;
const todayStr=()=>fmtDate(simNow);

const TYPES=['검사','점검','진단','측정','교육','신고·인허가'];
const UNITS={day:'일',month:'개월',year:'년',once:'1회 (기한 지정)'};
const RESULTS=['적합','조건부 적합','부적합·조치 필요'];
let _uid=0;const uid=p=>p+Date.now().toString(36)+(_uid++);
function defaultPlant(){return [
  {id:'P1',name:'폐수처리장',kind:'수질',equips:[{id:'E11',name:'최종방류구 수질 TMS'},{id:'E12',name:'생물반응조'},{id:'E13',name:'응집침전조'}]},
  {id:'P2',name:'보일러동 대기시설',kind:'대기',equips:[{id:'E21',name:'굴뚝 #1 TMS'},{id:'E22',name:'백필터 집진기'},{id:'E23',name:'증기보일러 B-01'}]},
  {id:'P3',name:'유해화학물질 취급시설',kind:'화학물질',equips:[{id:'E31',name:'염산 저장탱크 T-101'},{id:'E32',name:'가성소다 저장탱크 T-102'},{id:'E33',name:'탱크로리 하역장'}]},
  {id:'P4',name:'위험물 저장소',kind:'위험물',equips:[{id:'E41',name:'옥외탱크저장소 #1'},{id:'E42',name:'옥내저장소'}]},
  {id:'P5',name:'생산동 안전설비',kind:'산업안전',equips:[{id:'E51',name:'압력용기 V-201'},{id:'E52',name:'천장크레인 5톤'},{id:'E53',name:'국소배기장치 LEV-1'}]},
  {id:'P0',name:'사업장 공통',kind:'공통',equips:[{id:'E01',name:'사업장 전체'}]}
]}
function defaultLegal(){
  const t=dayStart(fmtDate(simNow0)),ago=n=>fmtDate(t-n*D),after=n=>fmtDate(t+n*D);
  const L=[
    ['P1','E11','검사','수질 TMS 정도검사','물환경보전법',1,'year',340,60,'측정기기 정도검사기관','수질 TMS 측정기 성능 확인'],
    ['P1','E11','측정','수질 자가측정 (TMS 외 항목)','물환경보전법',1,'month',27,7,'측정대행업체','BOD·노말헥산 등 TMS 미측정 항목'],
    ['P1','E12','점검','방지시설 운영 점검','사내 기준',1,'month',3,7,'환경팀',''],
    ['P2','E21','검사','굴뚝 TMS 정도검사','대기환경보전법',1,'year',200,60,'측정기기 정도검사기관',''],
    ['P2','E21','측정','대기 자가측정 (TMS 외 항목)','대기환경보전법',3,'month',78,14,'측정대행업체','배출구별 종별 주기 확인'],
    ['P2','E22','점검','여과포 상태 점검','사내 기준',6,'month',170,14,'환경팀','차압 추세 같이 확인'],
    ['P2','E23','검사','보일러 계속사용검사','에너지이용 합리화법',1,'year',300,60,'한국에너지공단',''],
    ['P3','E31','검사','유해화학물질 취급시설 정기검사','화학물질관리법',1,'year',330,60,'한국환경공단','검사 신청서·시설 도면 준비'],
    ['P3','E31','점검','취급시설 자체점검','화학물질관리법',7,'day',6,2,'환경팀','점검표 기록 후 보존'],
    ['P3','E32','검사','유해화학물질 취급시설 정기검사','화학물질관리법',1,'year',100,60,'한국환경공단',''],
    ['P3','E32','점검','취급시설 자체점검','화학물질관리법',7,'day',9,2,'환경팀',''],
    ['P3','E33','점검','하역장 자체점검','화학물질관리법',7,'day',2,2,'환경팀',''],
    ['P4','E41','점검','위험물 제조소등 정기점검','위험물안전관리법',1,'year',350,30,'위험물안전관리자',''],
    ['P4','E42','점검','위험물 제조소등 정기점검','위험물안전관리법',1,'year',120,30,'위험물안전관리자',''],
    ['P5','E51','검사','압력용기 안전검사','산업안전보건법',2,'year',700,60,'안전검사기관',''],
    ['P5','E52','검사','크레인 안전검사','산업안전보건법',2,'year',400,60,'안전검사기관',''],
    ['P5','E53','검사','국소배기장치 안전검사','산업안전보건법',2,'year',600,60,'안전검사기관','제어풍속 측정 결과 첨부'],
    ['P0','E01','측정','작업환경측정','산업안전보건법',6,'month',150,30,'지정측정기관',''],
    ['P0','E01','진단','특수건강진단','산업안전보건법',1,'year',250,30,'특수건강진단기관','대상자 명단 갱신'],
    ['P0','E01','교육','정기 안전보건교육 (분기)','산업안전보건법',3,'month',60,14,'안전팀','']

}
function defaultManual(){
  const rnd=mulberry32(7),out=[],t0=dayStart(fmtDate(simNow0));let id=1;
  const g=(b,n)=>b+(rnd()-.5)*2*n;

const stdOf=(fac,item)=>S.std.find(s=>s.fac===fac&&s.item===item);

/* ---------- 가상 TMS ---------- */
const TMS=new Map();
const SIM={
  'W1|pH':{b:7.2,a:.15,n:.08},'W1|TOC':{b:14,a:3,n:1.2},'W1|SS':{b:18,a:4,n:2},
  'W1|T-N':{b:28,a:3,n:1.2,ramp:true},'W1|T-P':{b:2.1,a:.4,n:.15},
  'A1|먼지':{b:3,a:.8,n:.4},'A1|NOx':{b:28,a:5,n:2},'A1|SOx':{b:8,a:2,n:1},'A1|CO':{b:12,a:4,n:3,spike:true}
};
const CAL=[
  {fac:'A1',s:dayStart(fmtDate(simNow0-2*D))+10*H,e:dayStart(fmtDate(simNow0-2*D))+11*H,st:'교정'},
  {fac:'W1',s:dayStart(fmtDate(simNow0-4*D))+14*H,e:dayStart(fmtDate(simNow0-4*D))+15*H,st:'교정'},
  {fac:'A1',s:simNow0-40*MIN,e:simNow0-20*MIN,st:'통신불량'}
];
const rnd=mulberry32(42);
function simPoint(t){
  const hr=new Date(t).getHours()+new Date(t).getMinutes()/60;
  for(const f of ['W1','A1']){
    let st='정상';
    for(const b of CAL) if(b.fac===f&&t>=b.s&&t<b.e) st=b.st;
    if(st==='정상'&&rnd()<.003) st='통신불량';
    for(const key of Object.keys(SIM)){
      if(!key.startsWith(f+'|'))continue;
      const p=SIM[key];
      let v=p.b+p.a*Math.sin((hr-9)/24*2*Math.PI)+(rnd()-.5)*2*p.n;
      if(p.ramp&&t>rampStart) v+=(t-rampStart)/H*2.8;
      if(p.spike&&rnd()<.01) v+=25+rnd()*20;
      if(st==='교정'){const sd=stdOf(f,key.split('|')[1]);v=(sd&&sd.max?sd.max:v)*1.3}
      if(key==='W1|pH') v=Math.min(Math.max(v,6),8.4);
      pushTMS(key,{t,v:Math.max(0,+v.toFixed(3)),st});
    }
  }
}
function pushTMS(key,p){if(!TMS.has(key))TMS.set(key,[]);TMS.get(key).push(p)}
function upsertTMS(key,p){
  if(!TMS.has(key))TMS.set(key,[]);
  const a=TMS.get(key),i=a.findIndex(x=>x.t===p.t);
  if(i>=0)a[i]=p;else{a.push(p);a.sort((x,y)=>x.t-y.t)}
}
loadState();
for(let t=simNow0-7*D;t<=simNow0;t+=STEP) simPoint(t);

function pts(key,from,to){const a=TMS.get(key)||[];return a.filter(p=>p.t>from&&p.t<=to)}
function avg(key,from,to){const n=pts(key,from,to).filter(p=>p.st==='정상');return n.length?n.reduce((s,p)=>s+p.v,0)/n.length:null}
const avg30=(key,end=simNow)=>avg(key,end-30*MIN,end);
function lastSt(key,end=simNow){const a=pts(key,end-30*MIN,end);return a.length?a[a.length-1].st:'자료 없음'}
function abnormal1h(key){return pts(key,simNow-H,simNow).filter(p=>p.st!=='정상')}

function judge(std,v){
  if(v==null||isNaN(v))return 'none';
  const {min,max}=std,ratio=S.ratio;
  if(min==null&&max==null)return 'rec';
  if((max!=null&&v>max)||(min!=null&&v<min))return 'over';
  if(min!=null&&max!=null){const m=(1-ratio)*(max-min)/2;return (v>max-m||v<min+m)?'warn':'ok'}
  if(max!=null&&v>=max*ratio)return 'warn';
  return 'ok';
}
function label(st,std){
  const proc=std&&facOf(std.fac).kind==='공정';
  return {ok:'정상',warn:'주의',over:proc?'범위 이탈':'초과',rec:'기록',none:'—'}[st];
}
const badge=(st,std)=>`<span class="badge b-${st}">${label(st,std)}</span>`;
function limitText(s){
  if(s.min!=null&&s.max!=null)return `${s.min} ~ ${s.max}`;
  if(s.max!=null)return `${s.max} 이하`;
  if(s.min!=null)return `${s.min} 이상`;
  return '기준 없음';
}
function predict(std){
  if(std.max==null||std.src!=='TMS')return null;
  const key=std.fac+'|'+std.item,n=pts(key,simNow-2*H,simNow).filter(p=>p.st==='정상');
  if(n.length<12)return null;
  const xs=n.map(p=>(p.t-simNow)/H),ys=n.map(p=>p.v),mx=xs.reduce((a,b)=>a+b)/xs.length,my=ys.reduce((a,b)=>a+b)/ys.length;
  let num=0,den=0;xs.forEach((x,i)=>{num+=(x-mx)*(ys[i]-my);den+=(x-mx)**2});
  const slope=num/den,cur=avg30(key);
  if(cur==null||slope<=std.max*0.02||cur>=std.max)return null;
  const h=(std.max-cur)/slope;
  return h<=6?{h,slope}:null;
}
function manualOn(date,fac,item){return S.manual.find(r=>r.date===date&&r.fac===fac&&r.item===item)}

function collectAlerts(){
  const out=[],today=todayStr();
  for(const s of S.std){
    const key=s.fac+'|'+s.item,f=facOf(s.fac);
    if(s.src==='TMS'){
      const v=avg30(key),st=judge(s,v);
      if(st==='over'||st==='warn')out.push({lvl:st,txt:`${f.name} ${s.item} 30분 평균 ${fmtV(v)} ${s.unit} (기준 ${limitText(s)})`,std:s});
      const p=predict(s);
      if(p&&st!=='over')out.push({lvl:'warn',txt:`${f.name} ${s.item} 상승 추세 (+${fmtV(p.slope)} ${s.unit}/시간) — 이대로면 약 ${p.h<1?Math.round(p.h*60)+'분':p.h.toFixed(1)+'시간'} 뒤 기준 도달`,std:s,pred:true});
    }else{
      const r=manualOn(today,s.fac,s.item);
      if(r){const st=judge(s,r.v);if(st==='over'||st==='warn')out.push({lvl:st,txt:`${f.name} ${s.item} 오늘 입력값 ${fmtV(r.v)} ${s.unit} (기준 ${limitText(s)})`,std:s})}
    }
  }
  for(const f of FAC){
    const keys=S.std.filter(s=>s.fac===f.id&&s.src==='TMS').map(s=>s.fac+'|'+s.item);
    if(!keys.length)continue;
    const ab=abnormal1h(keys[0]);
    if(ab.length){const kinds=[...new Set(ab.map(p=>p.st))].join(', ');out.push({lvl:'info',txt:`${f.name} 측정기 상태 이상 — 최근 1시간 중 ${ab.length*5}분 ${kinds} (평균 계산에서 제외)`})}
  }
  const order={over:0,warn:1,info:2};
  return out.sort((a,b)=>order[a.lvl]-order[b.lvl]);
}

function addPeriod(ds,n,u){
  const [y,m,d]=ds.split('-').map(Number);
  if(u==='day')return fmtDate(new Date(y,m-1,d+n).getTime());
  const mm=u==='year'?n*12:n,dim=new Date(y,m-1+mm+1,0).getDate();
  return fmtDate(new Date(y,m-1+mm,Math.min(d,dim)).getTime());
}
function dueOf(o){if(o.unit==='once')return o.done?null:(o.due||null);if(o.last)return addPeriod(o.last,o.every,o.unit);return o.due||null}
function ddayOf(o){const d=dueOf(o);return d==null?null:Math.round((dayStart(d)-dayStart(todayStr()))/D)}
function stOf(o){if(o.unit==='once'&&o.done)return 'done';const dd=ddayOf(o);if(dd==null)return 'nodate';if(dd<0)return 'overdue';if(dd<=o.lead)return 'soon';return 'ok'}
const ST_LBL={overdue:'기한 지남',soon:'알림 기간',ok:'예정',done:'완료',nodate:'기한 미정'};
const ST_CLS={overdue:'b-over',soon:'b-warn',ok:'b-acc',done:'b-ok',nodate:'b-rec'};

const plantOf=id=>S.plant.find(p=>p.id===id);
function equipOf(pid,eid){const p=plantOf(pid);return p?p.equips.find(e=>e.id===eid):null}
const eqName=o=>equipOf(o.plant,o.equip)?.name||'(설비 없음)';
function upcoming(){return S.legal.filter(o=>ddayOf(o)!=null).map(o=>({o,dday:ddayOf(o)})).sort((a,b)=>a.dday-b.dday)}
function recordDone(o,{date,result,by,note}){
  o.history=o.history||[];
  o.history.unshift({id:uid('H'),date,result,by,note});

  </div>

  </div>`;
  $('#inDate').onchange=e=>{inDate=e.target.value||todayStr();renderInput()};
  document.querySelectorAll('.pill').forEach(b=>b.onclick=()=>{inFac=b.dataset.fac;renderInput()});
  document.querySelectorAll('.manual-row').forEach(tr=>{
    const s=man[+tr.dataset.i],inp=tr.querySelector('.mv');
    inp.oninput=()=>{const v=inp.value===''?null:parseFloat(inp.value);tr.querySelector('.mst').innerHTML=badge(judge(s,v),s);tr.querySelector('.mErr').textContent=''};
    tr.querySelector('.mn').oninput=()=>tr.querySelector('.mErr').textContent='';
  });
  const save=$('#mSave');
  if(save)save.onclick=()=>{
    let any=false,bad=false;$('#mErr').textContent='';
    const rows=[...document.querySelectorAll('.manual-row')];
    rows.forEach(tr=>{
      const s=man[+tr.dataset.i],v=tr.querySelector('.mv').value,note=tr.querySelector('.mn').value.trim();
      if(v==='')return;any=true;
      if(judge(s,parseFloat(v))==='over'&&!note){tr.querySelector('.mErr').textContent='초과 항목은 조치 내용을 적어 주세요';bad=true}
    });
    if(!any){$('#mErr').textContent='값을 하나 이상 입력하세요';return}
    if(bad){$('#mErr').textContent='조치 내용이 빠진 항목이 있어요';return}
    const by=$('#mBy').value.trim()||'담당자';let n=0;
    rows.forEach(tr=>{
      const s=man[+tr.dataset.i],v=tr.querySelector('.mv').value,note=tr.querySelector('.mn').value.trim();
      const ex=manualOn(inDate,s.fac,s.item);
      if(v===''){if(ex)S.manual=S.manual.filter(r=>r!==ex);return}
      if(ex)Object.assign(ex,{v:parseFloat(v),note,by});
      else S.manual.push({id:Date.now()+Math.random(),date:inDate,fac:s.fac,item:s.item,v:parseFloat(v),by,note});
      n++;
    });
    saveState();toast(`${n}개 항목을 저장했어요`);renderInput();
  };
  document.querySelectorAll('.del').forEach(b=>b.onclick=()=>{S.manual=S.manual.filter(r=>String(r.id)!==b.dataset.id);saveState();toast('기록을 삭제했어요');renderInput()});
}

/* ---------- 이력 그래프 ---------- */
let H_={fac:'W1',item:'T-N',range:24,unit:'raw',ov:''};let chart=null;
function seriesFor(fac,item,range,unit){
  const s=stdOf(fac,item),from=simNow-range*H,key=fac+'|'+item;
  if(s.src==='TMS'){
    const all=pts(key,from,simNow);
    if(unit==='raw')return {norm:all.filter(p=>p.st==='정상').map(p=>({x:p.t,y:p.v,st:p.st})),ab:all.filter(p=>p.st!=='정상').map(p=>({x:p.t,y:p.v,st:p.st})),all};
    const size=unit==='30m'?30*MIN:D,b=new Map();
    for(const p of all){if(p.st!=='정상')continue;const k=unit==='day'?dayStart(fmtDate(p.t)):Math.ceil(p.t/size)*size;if(!b.has(k))b.set(k,[]);b.get(k).push(p.v)}
    const norm=[...b.entries()].sort((a,b)=>a[0]-b[0]).map(([k,v])=>({x:unit==='day'?k+12*H:k,y:v.reduce((a,c)=>a+c,0)/v.length,st:'정상'}));
    return {norm,ab:[],all};
  }
  const norm=S.manual.filter(r=>r.fac===fac&&r.item===item).map(r=>({x:dayStart(r.date)+9*H,y:r.v,st:'수기'})).filter(p=>p.x>from&&p.x<=simNow+D).sort((a,b)=>a.x-b.x);
  return {norm,ab:[],all:norm};
}
function renderHistory(){
  const s0=stdOf(H_.fac,H_.item);
  if(!s0){H_.item=S.std.find(s=>s.fac===H_.fac).item}
  const s=stdOf(H_.fac,H_.item),isT=s.src==='TMS';
  if(!isT)H_.unit='day';
  if(!isT&&H_.range<168)H_.range=336;
  const items=S.std.filter(x=>x.fac===H_.fac);
  $('#v-history').innerHTML=`
  <div class="card"><div class="row">
    <select id="hFac">${FAC.map(f=>`<option value="${f.id}" ${f.id===H_.fac?'selected':''}>${esc(f.name)}</option>`).join('')}</select>
    <select id="hItem">${items.map(x=>`<option ${x.item===H_.item?'selected':''}>${esc(x.item)}</option>`).join('')}</select>
    <select id="hRange">${[[24,'최근 24시간'],[72,'최근 3일'],[168,'최근 7일'],[336,'최근 14일']].map(([v,l])=>`<option value="${v}" ${v==H_.range?'selected':''}>${l}</option>`).join('')}</select>
    <select id="hUnit" ${isT?'':'disabled'}>${[['raw','5분 원자료'],['30m','30분 평균'],['day','일평균']].map(([v,l])=>`<option value="${v}" ${v===H_.unit?'selected':''}>${l}</option>`).join('')}</select>
    <label class="sub">겹쳐 보기</label>
    <select id="hOv"><option value="">없음</option>${S.std.filter(x=>!(x.fac===H_.fac&&x.item===H_.item)).map(x=>`<option value="${x.fac}|${x.item}" ${H_.ov===x.fac+'|'+x.item?'selected':''}>${esc(facOf(x.fac).name)} · ${esc(x.item)}</option>`).join('')}</select>
  </div></div>
  <div class="card"><h3>${esc(facOf(H_.fac).name)} · ${esc(H_.item)} <span class="muted">${isT?'TMS 자동 수집':'수기 입력'} · 빨간 점선 배출(관리)기준 · 주황 점선 ${Math.round(S.ratio*100)}% 관리선${isT&&H_.unit==='raw'?' · 회색 점은 교정·통신불량 등 제외된 자료':''}</span></h3>
    <div class="chartbox"><canvas id="hChart"></canvas></div></div>
  <div class="grid g4" id="hStats"></div>
  <div class="card" style="margin-top:16px"><div class="row"><button id="hCopy">표 복사 (엑셀에 붙여넣기)</button><span class="muted">그래프에 보이는 자료를 탭으로 구분된 표로 복사해요</span></div>
    <div id="copyFallback" class="hide" style="margin-top:10px"><textarea readonly></textarea></div></div>`;
  $('#hFac').onchange=e=>{H_.fac=e.target.value;H_.item=S.std.find(x=>x.fac===H_.fac).item;H_.ov='';renderHistory()};
  $('#hItem').onchange=e=>{H_.item=e.target.value;if(stdOf(H_.fac,H_.item).src==='TMS'&&H_.unit==='day')H_.unit='30m';renderHistory()};
  $('#hRange').onchange=e=>{H_.range=+e.target.value;if(H_.range>=168&&H_.unit==='raw'&&isT)H_.unit='30m';renderHistory()};
  $('#hUnit').onchange=e=>{H_.unit=e.target.value;renderHistory()};
  $('#hOv').onchange=e=>{H_.ov=e.target.value;renderHistory()};
  drawChart(s,isT);
}
function drawChart(s,isT){
  const ser=seriesFor(H_.fac,H_.item,H_.range,H_.unit),from=simNow-H_.range*H,to=simNow;
  const line=(y,c,dash,lbl)=>({type:'line',label:lbl,data:[{x:from,y},{x:to,y}],borderColor:c,borderDash:dash,borderWidth:1.5,pointRadius:0,yAxisID:'y'});
  const ds=[{type:'line',label:`${s.item} (${s.unit||'-'})`,data:ser.norm,borderColor:'#185FA5',backgroundColor:'#185FA5',borderWidth:1.6,pointRadius:isT&&H_.unit==='raw'?0:3,tension:.2,yAxisID:'y',spanGaps:false}];
  if(ser.ab.length)ds.push({type:'scatter',label:'제외된 자료 (교정·통신불량 등)',data:ser.ab,backgroundColor:'#B4B2A9',pointRadius:3,yAxisID:'y'});
  if(s.max!=null){ds.push(line(s.max,'#E24B4A',[6,4],'기준 상한'));if(s.min==null)ds.push(line(s.max*S.ratio,'#BA7517',[3,4],`관리선 ${Math.round(S.ratio*100)}%`))}
  if(s.min!=null)ds.push(line(s.min,'#E24B4A',[6,4],'기준 하한'));
  let ovStd=null;
  if(H_.ov){
    const [f,i]=H_.ov.split('|');ovStd=stdOf(f,i);
    const u=ovStd.src==='TMS'?(H_.unit==='day'||!isT?'day':'30m'):'day';
    const o=seriesFor(f,i,H_.range,u);
    ds.push({type:'line',label:`${facOf(f).name} ${i} (${ovStd.unit||'-'})`,data:o.norm,borderColor:'#1D9E75',backgroundColor:'#1D9E75',borderWidth:1.6,pointRadius:u==='day'?3:0,tension:.2,yAxisID:'y2'});
  }
  if(chart)chart.destroy();
  if(typeof Chart==='undefined'){$('#hChart').parentElement.innerHTML='<div class="sub">그래프 라이브러리를 불러오지 못했어요.</div>';return}
  const short=H_.range<=24;
  chart=new Chart($('#hChart'),{data:{datasets:ds},options:{animation:false,maintainAspectRatio:false,parsing:true,interaction:{mode:'nearest',intersect:false},
    scales:{x:{type:'linear',min:from,max:to,ticks:{maxTicksLimit:8,callback:v=>short?fmtTime(v):fmtMD(v)+(H_.range<=72?' '+fmtTime(v):'')},grid:{color:'#eeede8'}},
      y:{title:{display:true,text:`${s.item} ${s.unit}`},grid:{color:'#eeede8'},beginAtZero:s.item!=='pH'},
      ...(ovStd?{y2:{position:'right',title:{display:true,text:`${ovStd.item} ${ovStd.unit}`},grid:{drawOnChartArea:false}}}:{})},
    plugins:{legend:{labels:{boxWidth:12,font:{family:'Noto Sans KR'}}},tooltip:{callbacks:{title:it=>fmtFull(it[0].parsed.x),label:it=>`${it.dataset.label}: ${fmtV(it.parsed.y)}${it.raw.st&&it.raw.st!=='정상'&&it.raw.st!=='수기'?' ['+it.raw.st+']':''}`}}}}});
  const vals=ser.norm.map(p=>p.y);
  let overN=0,basis='';
  if(isT){const a30=seriesFor(H_.fac,H_.item,H_.range,'30m').norm;overN=a30.filter(p=>judge(s,p.y)==='over').length;basis='30분 평균 기준'}
  else{overN=ser.norm.filter(p=>judge(s,p.y)==='over').length;basis='입력 건 기준'}
  const abN=isT?ser.all.filter(p=>p.st!=='정상').length:0;
  $('#hStats').innerHTML=`
    <div class="metric"><div class="l">평균</div><div class="v">${vals.length?fmtV(vals.reduce((a,b)=>a+b)/vals.length):'—'}</div></div>
    <div class="metric"><div class="l">최대</div><div class="v">${vals.length?fmtV(Math.max(...vals)):'—'}</div></div>
    <div class="metric ${overN?'over':''}"><div class="l">기준 초과 (${basis})</div><div class="v">${overN}회</div></div>
    <div class="metric ${abN?'info':''}"><div class="l">제외된 자료</div><div class="v">${isT?Math.round(abN/Math.max(ser.all.length,1)*1000)/10+'%':'—'}</div></div>`;
  $('#hCopy').onclick=()=>{
    const rows=[['시각','시설','항목','값','단위','상태','판정']];
    const list=[...ser.norm,...ser.ab].sort((a,b)=>a.x-b.x);
    list.forEach(p=>rows.push([fmtFull(p.x),facOf(H_.fac).name,s.item,fmtV(p.y),s.unit,p.st,p.st==='정상'||p.st==='수기'?label(judge(s,p.y),s):'제외']));
    copyText(rows.map(r=>r.join('\t')).join('\n'),`${list.length}행을 복사했어요. 엑셀에 붙여넣으세요.`);
  };
}

function timelineHtml(list){
  const t0=dayStart(todayStr()),d0=new Date(t0);
  const start=new Date(d0.getFullYear(),d0.getMonth()-1,1).getTime();
  const end=dayStart(addPeriod(fmtDate(start),L_.months,'month'));
  const pos=t=>(t-start)/(end-start)*100,inWin=t=>t>=start&&t<=end;
  let months='',mlab='';
  for(let i=0;i<L_.months;i++){
    const t=dayStart(addPeriod(fmtDate(start),i,'month')),d=new Date(t);
    months+=`<i class="tl-m" style="left:${pos(t)}%"></i>`;
    if(L_.months<=12||i%2===0)mlab+=`<span class="tl-mlab" style="left:${pos(t)}%">${d.getMonth()===0||i===0?d.getFullYear()+'년 ':''}${d.getMonth()+1}월</span>`;
  }
  const today=`<span class="tl-today" style="left:${pos(t0)}%"></span>`;
  let html=`<div class="tl"><div class="tl-in"><div class="tl-head"><div class="tl-lab"></div><div class="tl-track">${mlab}${today}<span class="tl-todaylab" style="left:${pos(t0)}%">오늘</span></div></div>`;
  const groups=S.plant.filter(p=>list.some(o=>o.plant===p.id));
  for(const p of groups){
    html+=`<div class="tl-grp">${esc(p.name)} <span class="badge b-rec">${esc(p.kind)}</span></div>`;
    const rows=list.filter(o=>o.plant===p.id).sort((a,b)=>{const ea=p.equips.findIndex(e=>e.id===a.equip),eb=p.equips.findIndex(e=>e.id===b.equip);return ea-eb||sortByDue(a,b)});
    for(const o of rows){
      let mk='';const st=stOf(o),due=dueOf(o);
      for(const h of (o.history||[])){const t=dayStart(h.date);if(inWin(t))mk+=`<span class="mk mk-done" style="left:${pos(t)}%" title="완료 ${h.date} · ${esc(h.result)}${h.by?' · '+esc(h.by):''}"></span>`}
      if(due){
        const td=dayStart(due);
        const ls=Math.max(td-o.lead*D,start),le=Math.min(td,end);
        if(le>ls)mk+=`<span class="lead ${st==='overdue'?'overdue':''}" style="left:${pos(ls)}%;width:${pos(le)-pos(ls)}%" title="사전 알림 ${o.lead}일"></span>`;
        if(inWin(td))mk+=`<span class="mk mk-${st}" style="left:${pos(td)}%" title="${ST_LBL[st]} · 기한 ${due}"></span>`;
        if(o.unit!=='once'){
          const small=o.unit==='day'&&o.every<30;let nx=addPeriod(due,o.every,o.unit),n=0;
          while(dayStart(nx)<=end&&n<200){mk+=small?`<span class="mk-tick" style="left:${pos(dayStart(nx))}%" title="예상 ${nx}"></span>`:`<span class="mk mk-pred" style="left:${pos(dayStart(nx))}%" title="예상 ${nx}"></span>`;nx=addPeriod(nx,o.every,o.unit);n++}
        }
      }
      html+=`<div class="tl-row" data-id="${o.id}" title="눌러서 상세 수정"><div class="tl-lab"><b style="font-weight:500">${esc(eqName(o))}</b> · ${esc(o.name)}<div class="muted">${esc(o.type)} · ${cycleText(o)}${due?' · 기한 '+due:''}</div></div><div class="tl-track">${months}${today}${mk}</div></div>`;
    }
  }
  if(!groups.length)html+='<div class="sub" style="padding:16px 0">조건에 맞는 일정이 없어요.</div>';
  return html+'</div></div>';
}

const LAW_KINDS=['제정','일부개정','전부개정','타법개정','폐지','기타'];

      {id:uid('C'),law:'물환경보전법 시행규칙',kind:'일부개정',prom:ago(60),eff:ago(10),mst:'',summary:'예시) 수질 자가측정 관련 기준 정비',impact:'자가측정 항목·주기가 바뀌었는지 확인',note:'',status:'reviewed',src:'example'}
    ]};
}
const lawBase=n=>n.replace(/\s*(시행령|시행규칙)$/,'');
const linkedDuties=law=>S.legal.filter(o=>o.law&&lawBase(law).replace(/\s/g,'')===lawBase(o.law.replace(/\s*제\d.*$/,'')).replace(/\s/g,''));
const effDday=c=>c.eff?Math.round((dayStart(c.eff)-dayStart(todayStr()))/D):null;
const normYmd=s=>{s=String(s||'').replace(/[^0-9]/g,'');return s.length===8?s.slice(0,4)+'-'+s.slice(4,6)+'-'+s.slice(6):''};
let W_={panel:null,id:null,st:'',msg:'',busy:false};

function lawAlerts(){
  if(!S.laws)return [];
  const out=[];
  for(const c of S.laws.changes){
    const dd=effDday(c);
    if(c.status==='new')out.push({c,txt:`${c.src==='example'?'(예시) ':''}${c.law} ${c.kind} — 검토 전${c.eff?` · 시행 ${c.eff}`:''}`,soon:dd!=null&&dd>=0&&dd<=30});
    else if(dd!=null&&dd>=0&&dd<=30)out.push({c,txt:`${c.src==='example'?'(예시) ':''}${c.law} 개정 시행 ${dd===0?'오늘':dd+'일 전'} (${c.eff})`,soon:true});
  }
  return out;
}

function addChange(c){
  const dup=S.laws.changes.some(x=>x.law===c.law&&((c.mst&&x.mst===c.mst)||(x.prom===c.prom&&x.eff===c.eff)));
  if(dup)return false;
  S.laws.changes.unshift({id:uid('C'),kind:'기타',prom:'',eff:'',mst:'',summary:'',impact:'',note:'',status:'new',src:'manual',...c});
  return true;
}
/* GitHub Actions가 매일 만드는 data/laws.json 을 읽어 반영한다 */
async function syncFile(silent){
  W_.busy=true;if(!silent){W_.msg='불러오는 중…';renderLaws()}
  try{
    const r=await fetch('data/laws.json?ts='+Date.now(),{cache:'no-store'});
    if(!r.ok)throw new Error('응답 '+r.status);
    const j=await r.json();
    if(!j.updated){W_.msg='laws.json이 아직 비어 있어요. GitHub Actions에서 첫 실행을 해 주세요.';W_.fail=[];return}
    S.laws.changes=S.laws.changes.filter(c=>c.src!=='example');
    S.laws.tracked=(j.laws||[]).map(l=>({name:l.name,mst:l.mst||'',prom:l.prom||'',eff:l.eff||'',kind:l.kind||'',checked:l.checked||''}));
    let n=0;
    for(const c of (j.changes||[]).slice().reverse())
      if(addChange({law:c.law,kind:c.kind||'기타',prom:c.prom||'',eff:c.eff||'',mst:c.mst||'',summary:(c.type==='upcoming'?'[시행 예정] ':'')+(c.summary||'개정 내용 확인 필요'),src:'auto'}))n++;
    S.laws.lastCheck=String(j.updated).slice(0,16).replace('T',' ')+' (UTC)';
    W_.synced=true;W_.fail=j.errors||[];
    W_.msg=`법제처 자동 확인 결과를 불러왔어요 · 새로 반영 ${n}건`;
    saveState();if(n&&silent)toast(`새 법령 개정 ${n}건이 있어요`);
  }catch(e){
    W_.synced=false;W_.fail=[];
    W_.msg=silent?'':'자동 확인 결과(data/laws.json)를 못 찾았어요. GitHub Pages에 올린 앱에서만 동작해요.';
  }finally{W_.busy=false;if(view==='laws'||!silent)renderLaws();else if(view==='status')renderStatus()}
}

function importLawJSON(text){
  let arr;try{arr=JSON.parse(text.slice(text.indexOf('['),text.lastIndexOf(']')+1))}catch(e){return {err:'JSON 형식을 읽지 못했어요. [ 로 시작하는 배열을 붙여넣어 주세요.'}}
  if(!Array.isArray(arr))return {err:'배열 형식이 아니에요.'};
  let ok=0,dup=0;const bad=[];
  arr.forEach((x,i)=>{
    if(!x||!x.law){bad.push(`${i+1}번째: 법령명(law)이 없어요`);return}
    const prom=normYmd(x.prom),eff=normYmd(x.eff);
    if(addChange({law:String(x.law),kind:LAW_KINDS.includes(x.kind)?x.kind:(x.kind||'기타'),prom,eff,mst:String(x.mst||''),summary:String(x.summary||''),impact:String(x.impact||''),src:'claude'}))ok++;else dup++;
  });
  saveState();
  return {ok,dup,bad};
}

function sampleCSV(){
  const rows=['시각,시설ID,항목,값,상태'];
  for(let k=1;k<=3;k++){const t=simNow+k*STEP;rows.push(`${fmtFull(t)},W1,TOC,${(15+k).toFixed(1)},정상`);rows.push(`${fmtFull(t)},W1,SS,${(20+k*2).toFixed(1)},정상`)}
  rows.push(`${fmtFull(simNow+4*STEP)},A1,NOx,31.2,교정`);
  return rows.join('\n');
}
function importCSV(text){
  const lines=text.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);let ok=0;const bad=[];let maxT=0;
  lines.forEach((l,i)=>{
    const c=l.split(/[,\t]/).map(x=>x.trim().replace(/^"|"$/g,''));
    const t=Date.parse((c[0]||'').replace(' ','T'));
    if(i===0&&isNaN(t))return;
    if(isNaN(t)){bad.push(`${i+1}행: 시각 형식을 알 수 없어요 (예: 2026-11-04 09:05)`);return}
    const s=stdOf(c[1],c[2]);
    if(!s){bad.push(`${i+1}행: 등록되지 않은 시설·항목이에요 (${c[1]||'?'} / ${c[2]||'?'})`);return}
    if(s.src!=='TMS'){bad.push(`${i+1}행: ${c[2]}은(는) 수기 항목이라 '오늘 입력'에서 넣어 주세요`);return}
    const v=parseFloat(c[3]);if(isNaN(v)){bad.push(`${i+1}행: 값이 숫자가 아니에요`);return}
    const st=c[4]||'정상';if(!STATUS.includes(st)){bad.push(`${i+1}행: 상태는 ${STATUS.join('·')} 중 하나여야 해요`);return}
    upsertTMS(c[1]+'|'+c[2],{t,v,st});ok++;maxT=Math.max(maxT,t);
  });
  if(maxT>simNow)simNow=Math.floor(maxT/STEP)*STEP;
  return {ok,bad};
}

    ${S.std.map((s,i)=>`<tr><td class="sub">${esc(facOf(s.fac).name)}</td><td>${esc(s.item)}</td><td><span class="badge ${s.src==='TMS'?'b-acc':'b-rec'}">${s.src}</span></td><td class="muted">${esc(s.unit)}</td><td class="num"><input type="number" step="any" class="sMin" data-i="${i}" value="${s.min??''}"></td><td class="num"><input type="number" step="any" class="sMax" data-i="${i}" value="${s.max??''}"></td></tr>`).join('')}
    </table></div></div>
  <div class="card"><h3>법정 일정 · 법령 개정</h3><div class="sub">시설·설비별 검사·점검·진단 일정은 <a href="#legal">법정 일정</a>, 관련 법령 개정 확인은 <a href="#laws">법령 개정</a> 페이지에서 관리해요.</div></div>
  <div class="card"><h3>초기화</h3><div class="row"><button class="danger" id="reset">예시 데이터로 되돌리기</button><span class="sub" id="resetMsg">수기 기록, 기준, 시설·설비, 일정이 이 브라우저에만 저장돼요.</span></div></div>`;
  $('#csvFile').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{$('#csvText').value=r.result};r.readAsText(f,'utf-8')};
  $('#csvSample').onclick=()=>{$('#csvText').value=sampleCSV()};
  $('#csvGo').onclick=()=>{
    const txt=$('#csvText').value.trim();
    if(!txt){$('#csvMsg').innerHTML='<span class="err">CSV 내용을 넣어 주세요</span>';return}
    const r=importCSV(txt);updateClock();
    $('#csvMsg').textContent=`${r.ok}행을 가져왔어요${r.bad.length?`, ${r.bad.length}행은 건너뛰었어요`:''}.`;
    $('#csvBad').innerHTML=r.bad.slice(0,10).map(esc).join('<br>')+(r.bad.length>10?`<br>외 ${r.bad.length-10}행`:'');
  };
  $('#csvText').oninput=()=>{$('#csvMsg').textContent='';$('#csvBad').textContent=''};
  $('#ratio').onchange=e=>{const v=+e.target.value;if(!(v>=50&&v<=95)){$('#ratioErr').textContent='50~95 사이로 넣어 주세요';return}$('#ratioErr').textContent='';S.ratio=v/100;saveState();toast(`주의 기준을 ${v}%로 바꿨어요`)};
  const num=v=>v===''?undefined:parseFloat(v);
  document.querySelectorAll('.sMin').forEach(inp=>inp.onchange=()=>{S.std[+inp.dataset.i].min=num(inp.value);saveState();toast('기준을 저장했어요')});
  document.querySelectorAll('.sMax').forEach(inp=>inp.onchange=()=>{S.std[+inp.dataset.i].max=num(inp.value);saveState();toast('기준을 저장했어요')});
  let armed=false;
  $('#reset').onclick=()=>{
    if(!armed){armed=true;$('#reset').textContent='한 번 더 누르면 되돌려요';return}
    try{localStorage.removeItem(LS)}catch(e){}
    loadState();toast('예시 데이터로 되돌렸어요');renderSettings();
  };
}

/* ---------- 실시간 시뮬레이션 ---------- */
let timer=null;
$('#simBtn').onclick=()=>{
  if(timer){clearInterval(timer);timer=null;$('#simBtn').textContent='실시간 시뮬레이션 시작';$('#liveDot').classList.remove('on');return}
  $('#simBtn').textContent='시뮬레이션 멈춤 (2초 = 5분)';$('#liveDot').classList.add('on');
  timer=setInterval(()=>{simNow+=STEP;simPoint(simNow);if(view==='status'||view==='history')render();else updateClock()},2000);
};

window.addEventListener('hashchange',route);
route();
syncFile(true);
</script>
</body>
</html>
